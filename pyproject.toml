[project]
name = "sistema-academico"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "psycopg2>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: reglas aisladas, sin base de datos",
    "integration: servicio + repositorio con base de datos de prueba",
    "api: endpoints HTTP con TestClient",
]

# La cobertura de la clase se mide solo sobre el módulo de estudiantes.
[tool.coverage.run]
include = [
    "domain/estudiante.py",
    "application/services/estudiante_service.py",
    "infrastructure/repositories/estudiante_repository.py",
    "presentation/routers/estudiante_router.py",
]

[tool.coverage.report]
fail_under = 85

# Lint y formato con ruff: `ruff check` revisa, `ruff format` da formato.
[tool.ruff]
line-length = 100
target-version = "py314"
# Solo código: no reformatea los bloques de código de los .md
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I orden de imports, B errores probables, UP sintaxis moderna.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Los seeders son tablas de datos: se permiten líneas largas.
"infrastructure/seeders/*" = ["E501"]
